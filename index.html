<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verg — Journal on paper, not on your phone</title>
    <meta name="description" content="Verg is a journaling app that gets you off your phone. Light a candle, write on paper until it burns down, then snap a photo to keep your streak.">
    <meta property="og:title" content="Verg — Journal on paper, not on your phone">
    <meta property="og:description" content="Light a candle. Write on paper. Snap a photo.">
    <meta property="og:url" content="https://verg.app">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px 24px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        .tagline {
            color: #888;
            font-size: 1.1rem;
            max-width: 400px;
        }

        .candle-hint {
            color: #666;
            font-size: 0.9rem;
            margin-top: 26px;
            min-height: 1.4em;
            transition: color .3s;
        }
        .candle-hint.done { color: #f5a623; }

        /* ---------- Candle ---------- */
        .candle-stage {
            position: relative; width: 280px; height: 400px; margin: 0 auto;
            cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
            outline: none;
        }
        .candle-stage:focus-visible { border-radius: 24px; box-shadow: 0 0 0 2px #f5a623; }

        .glow {
            position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%);
            width: 420px; height: 420px; border-radius: 50%;
            background: radial-gradient(circle, rgba(245,166,35,0.28), rgba(245,166,35,0.07) 45%, transparent 70%);
            opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
        }
        .lit .glow { opacity: 1; animation: glowPulse 3.2s ease-in-out infinite; }
        @keyframes glowPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.06); opacity: 0.85; }
        }

        /* wax body — height driven by --burn (1 = full, 0 = burned out) */
        .candle-stage { --burn: 1; --wax-h: calc(64px + var(--burn) * 196px); }
        .wax {
            position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
            width: 92px; height: var(--wax-h);
            background: linear-gradient(90deg, #e8d9bd, #fdf3dd 30%, #f3e5c8 55%, #d9c6a3);
            border-radius: 14px 14px 8px 8px;
            box-shadow: inset -8px 0 16px rgba(120, 90, 40, 0.25), inset 8px 0 16px rgba(255, 250, 235, 0.4);
        }
        .wax::before {
            content: ''; position: absolute; top: -7px; left: -3px; right: -3px; height: 16px;
            background: linear-gradient(90deg, #f0e2c4, #fffaf0 40%, #f5e9cf);
            border-radius: 50% / 60%;
        }
        .wax::after {
            content: ''; position: absolute; top: 2px; left: 8px; width: 13px; height: 44px;
            background: linear-gradient(#fdf5e2, #ecdcbc);
            border-radius: 8px 8px 10px 10px; opacity: 0.9;
        }
        .wick {
            position: absolute; left: 50%; bottom: calc(56px + var(--wax-h) + 2px);
            transform: translateX(-50%);
            width: 5px; height: 16px; background: linear-gradient(#1c1712, #4a3b28);
            border-radius: 3px 3px 0 0;
        }
        .lit .wick { background: linear-gradient(#ff9d2e, #3a2c1a 60%); }

        .flame {
            position: absolute; left: 50%; bottom: calc(56px + var(--wax-h) + 12px);
            transform: translateX(-50%);
            width: 30px; height: 58px; transform-origin: 50% 100%;
            opacity: 0; transition: opacity .5s;
            pointer-events: none;
        }
        .lit .flame { opacity: 1; animation: flicker 0.28s ease-in-out infinite alternate; }
        .flame .outer {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 80%, #ffdf8e 0%, #ffb63d 45%, #f2701d 80%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            filter: blur(0.5px);
            box-shadow: 0 0 26px 8px rgba(245, 166, 35, 0.35), 0 0 70px 24px rgba(245, 140, 30, 0.18);
        }
        .flame .inner {
            position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
            width: 13px; height: 26px;
            background: radial-gradient(ellipse at 50% 85%, #fff9e8 10%, #ffe9a8 55%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
        .flame .blue {
            position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
            width: 16px; height: 10px;
            background: radial-gradient(ellipse, rgba(90, 150, 255, 0.75), transparent 70%);
            border-radius: 50%;
        }
        @keyframes flicker {
            0%   { transform: translateX(-50%) scale(1, 1) rotate(-1.5deg); }
            30%  { transform: translateX(-52%) scale(0.96, 1.05) rotate(1deg); }
            60%  { transform: translateX(-49%) scale(1.03, 0.95) rotate(-0.5deg); }
            100% { transform: translateX(-50%) scale(0.98, 1.08) rotate(1.5deg); }
        }

        .smoke {
            position: absolute; left: 50%; bottom: calc(56px + var(--wax-h) + 18px);
            transform: translateX(-50%);
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(200, 200, 200, 0.45); filter: blur(4px);
            opacity: 0; pointer-events: none;
        }
        .puff .smoke { animation: smokeUp 1.6s ease-out forwards; }
        @keyframes smokeUp {
            0% { opacity: 0.7; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-46%, -90px) scale(3.4); }
        }

        .holder {
            position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
            width: 164px; height: 30px;
            background: linear-gradient(#3a2f22, #241c12);
            border-radius: 50% / 55%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255, 220, 160, 0.12);
        }
        .holder::after {
            content: ''; position: absolute; left: 50%; top: 42%; transform: translateX(-50%);
            width: 116px; height: 14px; border-radius: 50%;
            background: rgba(0,0,0,0.35);
        }

        .timer {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
            transition: color .4s;
        }
        .lit-timer { color: #f5a623; }
        .timer-actions { min-height: 1.6em; }
        .timer-actions button {
            background: none; border: none; color: #555; cursor: pointer;
            font-size: 0.85rem; font-family: inherit; text-decoration: underline;
        }
        .timer-actions button:hover { color: #888; }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #f5f5f5;
            color: #0a0a0a;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 28px;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .download-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }
        .download-btn svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }
        .btn-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .btn-store {
            font-size: 1.05rem;
            font-weight: 700;
        }

        footer {
            margin-top: 48px;
            color: #444;
            font-size: 0.8rem;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: #888;
        }
        footer p { margin-top: 6px; }

        @media (prefers-reduced-motion: reduce) {
            .lit .flame, .lit .glow { animation: none; }
        }
    </style>
</head>
<body>

    <h1>Verg🕯️</h1>
    <p class="tagline">A journaling app that gets you off your phone and onto paper.</p>

    <p class="candle-hint" id="hint">Click the candle to light it</p>

    <div class="candle-stage" id="stage" role="button" tabindex="0" aria-label="Candle timer: click to start a 10 minute timer">
        <div class="glow"></div>
        <div class="wax"></div>
        <div class="wick"></div>
        <div class="flame">
            <div class="outer"></div>
            <div class="inner"></div>
            <div class="blue"></div>
        </div>
        <div class="smoke"></div>
        <div class="holder"></div>
    </div>

    <div class="timer" id="timer">10:00</div>
    <div class="timer-actions">
        <button id="reset" hidden>reset candle</button>
    </div>

    <a class="download-btn" href="/download/">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <span class="btn-text">
            <span class="btn-label">Download on the</span>
            <span class="btn-store">App Store</span>
        </span>
    </a>

    <footer>
        <a href="support/">Support</a>
        <a href="privacy/">Privacy</a>
        <a href="terms/">Terms</a>
        <p>&copy; 2026 Verg. All rights reserved.</p>
    </footer>

<script>
(function () {
    const DURATION = 10 * 60 * 1000; // 10 minutes
    const stage = document.getElementById('stage');
    const timerEl = document.getElementById('timer');
    const hint = document.getElementById('hint');
    const resetBtn = document.getElementById('reset');

    // remaining ms when paused; endTime while burning
    let remaining = DURATION;
    let endTime = null;
    let rafId = null;
    let state = 'idle'; // idle | burning | paused | done

    function fmt(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return m + ':' + String(s).padStart(2, '0');
    }

    function render(ms) {
        timerEl.textContent = fmt(ms);
        stage.style.setProperty('--burn', (ms / DURATION).toFixed(4));
        if (state === 'burning') document.title = fmt(ms) + ' 🕯️ Verg';
    }

    function tick() {
        const left = endTime - Date.now();
        if (left <= 0) return finish();
        render(left);
        rafId = requestAnimationFrame(tick);
    }

    function light() {
        endTime = Date.now() + remaining;
        state = 'burning';
        stage.classList.add('lit');
        stage.classList.remove('puff');
        timerEl.classList.add('lit-timer');
        hint.textContent = 'Now put this device down and write — click again to blow it out';
        hint.classList.remove('done');
        resetBtn.hidden = false;
        rafId = requestAnimationFrame(tick);
    }

    function blowOut() {
        cancelAnimationFrame(rafId);
        remaining = Math.max(0, endTime - Date.now());
        state = 'paused';
        stage.classList.remove('lit');
        stage.classList.add('puff');
        timerEl.classList.remove('lit-timer');
        hint.textContent = 'Blown out — click to relight where you left off';
        document.title = 'Verg — Journal on paper, not on your phone';
        render(remaining);
    }

    function finish() {
        cancelAnimationFrame(rafId);
        remaining = 0;
        state = 'done';
        stage.classList.remove('lit');
        stage.classList.add('puff');
        timerEl.classList.remove('lit-timer');
        render(0);
        hint.textContent = 'The candle burned out — time to snap a photo of your page ✍️';
        hint.classList.add('done');
        document.title = 'Time’s up 🕯️ Verg';
        chime();
    }

    function reset() {
        cancelAnimationFrame(rafId);
        remaining = DURATION;
        endTime = null;
        state = 'idle';
        stage.classList.remove('lit', 'puff');
        timerEl.classList.remove('lit-timer');
        hint.textContent = 'Click the candle to light it';
        hint.classList.remove('done');
        resetBtn.hidden = true;
        document.title = 'Verg — Journal on paper, not on your phone';
        render(DURATION);
    }

    function toggle() {
        if (state === 'burning') blowOut();
        else if (state === 'done') reset();
        else light();
    }

    // Gentle two-note bell when the candle finishes, generated with WebAudio
    // (allowed because the session began with a user gesture).
    let audioCtx = null;
    stage.addEventListener('click', () => {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
    }, { once: true });

    function chime() {
        if (!audioCtx) return;
        [ [880, 0], [660, 0.35] ].forEach(([freq, delay]) => {
            const t = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 1.7);
        });
    }

    stage.addEventListener('click', toggle);
    stage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    resetBtn.addEventListener('click', reset);

    render(DURATION);
})();
</script>

</body>
</html>
