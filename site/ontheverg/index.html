<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Verg">
    <meta name="theme-color" content="#0a0a0a">
    <title>On the Verg 🕯️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .icon {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(120, 60, 180, 0.35);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        .tagline {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 48px;
            max-width: 340px;
        }
        .promo-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 360px;
            width: 100%;
            margin-bottom: 20px;
        }
        .promo-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 16px;
        }
        .promo-code {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #f5f5f5;
            margin-bottom: 24px;
            font-variant-numeric: tabular-nums;
        }
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f5f5f5;
            color: #0a0a0a;
            border: none;
            cursor: pointer;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.15s ease, transform 0.15s ease;
            width: 100%;
            justify-content: center;
        }
        .copy-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }
        .copy-btn.copied {
            background-color: #1a1a1a;
            color: #7c3aed;
            border: 1px solid #7c3aed44;
        }
        .copy-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .instructions {
            color: #555;
            font-size: 0.85rem;
            max-width: 300px;
            line-height: 1.6;
        }
        .instructions a {
            color: #666;
            text-decoration: none;
        }
        .instructions a:hover {
            color: #999;
        }
        footer {
            position: fixed;
            bottom: 28px;
            color: #444;
            font-size: 0.8rem;
        }
        footer a {
            color: #555;
            text-decoration: none;
        }
        footer a:hover {
            color: #888;
        }
    </style>
</head>
<body>
    <img
        class="icon"
        src="/assets/appicon.png"
        alt="Verg app icon"
    >
    <h1>On the Verg🕯️</h1>
    <p class="tagline">You're getting free premium access. Here's your code.</p>

    <div class="promo-card">
        <p class="promo-label">Your promo code</p>
        <p class="promo-code">ontheverg</p>
        <button class="copy-btn" onclick="copyCode(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy Code</span>
        </button>
    </div>

    <p class="instructions">
        Redeem in <a href="/download">Verg</a> under Settings → Friends &amp; Family Access.
    </p>

    <footer>
        <a href="/">verg.app</a>
    </footer>

    <script>
        function copyCode(btn) {
            navigator.clipboard.writeText('ontheverg').then(() => {
                btn.classList.add('copied');
                btn.querySelector('span').textContent = 'Copied!';
                btn.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12"/>';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.querySelector('span').textContent = 'Copy Code';
                    btn.querySelector('svg').innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
                }, 2000);
            });
        }
    </script>
</body>
</html>
