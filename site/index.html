<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verg — Journal on paper, on your phone</title>
    <meta name="description" content="Verg is a journaling app that gets you off your phone. Light a candle, write on paper until it burns down, then snap a photo to keep your streak.">
    <meta property="og:title" content="Verg — Journal on paper, on your phone">
    <meta property="og:description" content="Light a candle. Write on paper. Snap a photo.">
    <meta property="og:url" content="https://verg.app">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Verg">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .icon {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(120, 60, 180, 0.35);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        .tagline {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
            max-width: 340px;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #f5f5f5;
            color: #0a0a0a;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .download-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }
        .download-btn svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }
        .btn-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .btn-store {
            font-size: 1.05rem;
            font-weight: 700;
        }
        footer {
            position: fixed;
            bottom: 28px;
            color: #555;
            font-size: 0.8rem;
        }
        footer a {
            color: #666;
            text-decoration: none;
        }
        footer a:hover {
            color: #888;
        }
    </style>
</head>
<body>
    <img
        class="icon"
        src="/assets/appicon.png"
        alt="Verg app icon"
    >
    <h1>Verg🕯️</h1>
    <p class="tagline">A journaling app that gets you off your phone and onto paper.</p>

    <a class="download-btn" href="https://apps.apple.com/us/app/verg-journal-habit-tracker/id6758077555">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <span class="btn-text">
            <span class="btn-label">Download on the</span>
            <span class="btn-store">App Store</span>
        </span>
    </a>

    <footer>
        verg.app
    </footer>
</body>
</html>
